<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folk DJ Player</title>
<meta name="description" content="A simple mobile-friendly music player for the folk song playlist.">
<meta name="theme-color" content="#0f0c1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Folk DJ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <span class="logo">🎧 Folk DJ</span>
    <span class="count" id="trackCount"></span>
  </header>

  <main class="player">
    <div class="art" id="art">
      <div class="art-disc" id="disc">🎵</div>
    </div>

    <div class="meta">
      <h1 id="title">Loading…</h1>
      <p id="artist">—</p>
    </div>

    <div class="progress-wrap">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span class="time" id="durTime">0:00</span>
    </div>

    <div class="controls">
      <button id="shuffleBtn" class="ctl small" title="Shuffle" aria-label="Shuffle">🔀</button>
      <button id="prevBtn" class="ctl" title="Previous" aria-label="Previous">⏮</button>
      <button id="playBtn" class="ctl big" title="Play/Pause" aria-label="Play or pause">▶️</button>
      <button id="nextBtn" class="ctl" title="Next" aria-label="Next">⏭</button>
      <button id="repeatBtn" class="ctl small" title="Repeat" aria-label="Repeat">🔁</button>
    </div>

    <div class="controls-row2">
      <button id="stopBtn" class="pill-btn" title="Stop playback" aria-label="Stop">⏹ Stop</button>
      <button id="floatBtn" class="pill-btn" title="Show floating mini-player overlay" aria-label="Show overlay">🗗 Overlay</button>
      <button id="pipBtn" class="pill-btn" title="Pop out as always-on-top window" aria-label="Pop out player" hidden>📌 Pop-out</button>
      <button id="installBtn" class="pill-btn" title="Install as app for best background playback" aria-label="Install app" hidden>⬇️ Install App</button>
    </div>
    <p class="hint" id="bgHint">💡 For uninterrupted playback with the screen off, install this as an app (tap “Install App” above, or your browser’s “Add to Home Screen”).</p>

    <div class="volume-wrap">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" value="1" step="0.01">
    </div>

    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <section class="playlist" id="playlist" aria-label="Playlist"></section>

  <footer class="foot">Tap a song to play • Works offline once loaded</footer>
</div>

<div id="miniPlayer" class="mini-player" hidden>
  <button id="miniDrag" class="mini-drag" aria-label="Drag handle">⠿</button>
  <div class="mini-art">🎵</div>
  <div class="mini-info">
    <div class="mini-title" id="miniTitle">—</div>
  </div>
  <button id="miniPlayBtn" class="mini-btn" aria-label="Play or pause">▶️</button>
  <button id="miniStopBtn" class="mini-btn" aria-label="Stop">⏹</button>
  <button id="miniCloseBtn" class="mini-btn" aria-label="Close overlay">✕</button>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
